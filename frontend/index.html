            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-white dark:bg-[#111827] w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
                <h3 className="text-base font-bold text-slate-900 dark:text-white">
                  ⚖️ AI Smart Workload Rebalance
                </h3>
                <p className="text-xs text-slate-600 dark:text-slate-300">
                  Ananya Rao is currently holding 42 active applications (22 pending approval near deadline). 
                  Auto-rebalance will redistribute 16 non-complex document checks to Vikram Singh and Meera Sen.
                </p>
                <div className="p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-xl text-xs text-emerald-800 dark:text-emerald-300 font-medium">
                  ✓ Expected SLA Breach Risk Reduction: 74%
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsRebalanceModalOpen(false)} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-xs font-semibold rounded-lg">
                    Cancel
                  </button>
                  <button onClick={handleRebalanceWorkload} className="px-4 py-2 bg-[#0F4A44] hover:bg-[#0B3834] text-white text-xs font-bold rounded-lg">
                    Execute Rebalance
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 5. EXPORT SLA REPORT MODAL */}
          {isExportReportOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-white dark:bg-[#111827] w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
                <h3 className="text-base font-bold text-slate-900 dark:text-white">
                  📄 State SLA Compliance Audit Report
                </h3>
                <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs space-y-2 font-mono">
                  <p>===========================================</p>
                  <p>DELAYGUARD GOV SLA INTELLIGENCE DOSSIER</p>
                  <p>Date: 22 August 2026 • District: All Central</p>
                  <p>Total Applications Monitored: {metrics.totalApplications}</p>
                  <p>Compliance Rate: 92.8% • Critical: {metrics.criticalRed}</p>
                  <p>Bottlenecks: Document Verification (45%)</p>
                  <p>===========================================</p>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsExportReportOpen(false)} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-xs font-semibold rounded-lg">
                    Close
                  </button>
                  <button onClick={() => {
                    showToast('Report downloaded to PDF format.');
                    setIsExportReportOpen(false);
                  }} className="px-4 py-2 bg-[#0F4A44] hover:bg-[#0B3834] text-white text-xs font-bold rounded-lg flex items-center gap-1">
                    <Icons.Download className="w-3.5 h-3.5" />
                    <span>Download PDF</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 6. HELP & SLA GUIDELINES MODAL */}
          {isHelpModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-white dark:bg-[#111827] w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
                <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <Icons.Help className="w-5 h-5 text-teal-600" />
                  <span>DelayGuard SLA Intelligence System</span>
                </h3>
                <div className="text-xs text-slate-600 dark:text-slate-300 space-y-2">
                  <p><strong>DelayGuard</strong> continuously tracks statutory citizen service guarantee timelines under state public service legislation.</p>
                  <p><strong>Color Codes:</strong></p>
                  <ul className="list-disc pl-5 space-y-1">
                    <li><span className="text-red-600 font-bold">Critical:</span> Less than 24-48 hours before statutory breach deadline.</li>
                    <li><span className="text-amber-600 font-bold">High:</span> Approaching stage threshold.</li>
                    <li><span className="text-blue-600 font-bold">Medium / Low:</span> Within normal processing window.</li>
                  </ul>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setIsHelpModalOpen(false)} className="px-4 py-2 bg-[#0F4A44] text-white text-xs font-bold rounded-lg">
                    Got it
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 7. REAL-TIME TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-xs font-semibold z-50 animate-fadeIn">
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Mount DelayGuard React Application
    ReactDOM.createRoot(document.getElementById('root')).render(<DelayGuardApp />);
  </script>
</body>
</html>
